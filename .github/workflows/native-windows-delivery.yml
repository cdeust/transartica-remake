name: Native Windows installer

on:
  workflow_dispatch:
  push:
    branches: [fix/faithful-orchestral-score]
    paths: [native-game/**, game/data/**, game/assets/**, .github/workflows/native-windows-delivery.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-json-c
      - name: Record toolchain
        run: |
          mkdir -p delivery
          pacman -Q > delivery/msys2-packages.txt
          gcc --version > delivery/compiler.txt
          cmake --version > delivery/cmake.txt
      - name: Build and test native Windows code
        run: |
          cmake -S native-game -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/native --parallel 1
          ctest --test-dir build/native --output-on-failure --parallel 1
          python -B -m unittest discover -s native-game/packaging -p 'test_*installer*.py'
          cmake --install build/native --prefix "$PWD/build/install"
      - name: Close runtime dependencies
        run: |
          python -B native-game/packaging/windows_bundle.py --source build/install --output build/windows-payload --prefix "$(cygpath -m /ucrt64)"
      - name: Compile setup executable
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing from Windows runner' }
          & $compiler "/DPayload=$pwd\build\windows-payload" "/DOutput=$pwd\delivery" '/DBuildVersion=0.1.0' native-game/packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Install, launch, and uninstall on Windows
        shell: pwsh
        run: |
          ./native-game/packaging/windows_smoke.ps1 -Installer delivery/Transartica-setup.exe -Evidence delivery/windows-smoke
      - name: Preserve build evidence and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Transartica-Windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            delivery/
            build/native/Testing/Temporary/LastTest.log
            build/windows-payload/package-receipt.json
