; Source: Godot 4.5 desktop export documentation, tasks/evidence/engine-choice.md.
; Local private preview exports. Original data must not be published under MIT.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="private-data/*"
exclude_filter="save/*,tests/*"
export_path="../builds/windows/Transartica.exe"

[preset.0.options]
custom_template/debug="../.toolchain/export-templates/windows_debug_x86_64.exe"
custom_template/release="../.toolchain/export-templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=false
application/product_name="Transartica"
application/file_description="Private Transartica remake build"

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="private-data/*"
exclude_filter="save/*,tests/*"
export_path="../builds/Transartica-macOS.zip"

[preset.1.options]
custom_template/debug="../.toolchain/export-templates/macos.zip"
custom_template/release="../.toolchain/export-templates/macos.zip"
application/bundle_identifier="local.transartica.preview"
application/short_version="0.1.0"
application/version="0.1.0"
codesign/codesign=1
notarization/notarization=0
